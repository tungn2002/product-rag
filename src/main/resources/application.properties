spring.application.name=chatRAG

# MySQL DataSource Configuration
# Lưu ý: Bạn có thể đổi port (3306), tên database (chat_rag), username và password nếu MySQL trên máy bạn khác
spring.datasource.url=jdbc:mysql://localhost:3306/chat_rag?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
