spring.application.name=chatRAG

# MySQL DataSource Configuration (Match với docker-compose)
spring.datasource.url=jdbc:mysql://localhost:3306/chat_rag?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Google GenAI Configuration (Chat & Embedding)
spring.ai.google.genai.api-key=
spring.ai.google.genai.chat.options.model=gemini-3.8-flash

# Google GenAI Embedding Configuration (gemini-embedding-001)
spring.ai.google.genai.embedding.vertex-ai=false
spring.ai.google.genai.embedding.project-id=local
spring.ai.google.genai.embedding.location=global
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
spring.ai.google.genai.embedding.api-key=${spring.ai.google.genai.api-key}

# Chroma Vector Store Configuration (Match với docker-compose port 8000)
spring.ai.vectorstore.chroma.client.host=http://localhost
spring.ai.vectorstore.chroma.client.port=8000
spring.ai.vectorstore.chroma.collection-name=product
spring.ai.vectorstore.chroma.initialize-schema=true
